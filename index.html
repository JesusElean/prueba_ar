<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ComiraTrack AR</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background-color: #0f0f0f;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        model-viewer {
            width: 100%;
            height: 100%;
        }
        /* Botón de AR flotante, grande y llamativo estilo app */
        #ar-button {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ff5722;
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            z-index: 10;
        }
    </style>
</head>
<body>

    <model-viewer 
        src="./Exports/Mision.glb" 
        alt="Modelo 3D AR" 
        auto-rotate 
        camera-controls 
        ar 
        ar-modes="scene-viewer quick-look webxr"
        shadow-intensity="1">
        
        <button slot="ar-button" id="ar-button">
            🚀 Ver en tu espacio (AR)
        </button>
    </model-viewer>

</body>
</html>
