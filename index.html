<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor 3D y AR</title>
    <!-- Importa el componente model-viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #121212;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
        }
        model-viewer {
            width: 100%;
            max-width: 800px;
            height: 500px;
            background-color: #1e1e1e;
            border-radius: 12px;
        }
        /* Estilo para el botón de Realidad Aumentada */
        #ar-button {
            background-color: #ffffff;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <h2>Visualizador 3D con Soporte AR</h2>

    <!-- model-viewer con soporte para rotar, zoom y AR -->
    <model-viewer 
        src="./Exports/Mision.glb" 
        ios-src="tu-modelo.usdz"
        alt="Un modelo 3D de Blender" 
        auto-rotate 
        camera-controls 
        ar 
        ar-modes="scene-viewer quick-look webxr">
        
        <button slot="ar-button" id="ar-button">
            Ver en tu espacio (AR) 🚀
        </button>
    </model-viewer>

    <p style="font-size: 14px; color: #aaa; text-align: center; max-width: 600px; padding: 0 20px;">
        Nota: Para que funcione en iPhone/iPad, lo ideal es agregar también la versión <code>ios-src</code> en formato <code>.usdz</code>. En Android abrirá directamente con Scene Viewer.
    </p>

</body>
</html>
